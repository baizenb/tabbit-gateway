name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          curl -sL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: SDK check
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          sdkmanager --list 2>/dev/null | grep -E "platforms;android-34 \||build-tools;34" || true

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log | grep -aE "^> Task|BUILD" | tail -8 || true
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            echo "::error::gradle assembleDebug exit $st"
            grep -aE "FAILURE|What went wrong|Caused by|error:|Exception|FAILED|> " /tmp/build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit $st
          fi


      - name: Release APK
        run: |
          TOKEN="${GITHUB_TOKEN}"
          RID=$(curl -s -H "Authorization: token $TOKEN" https://api.github.com/repos/baizenb/tabbit-gateway/releases/tags/v1.0.0 | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$RID" ]; then
            RID=$(curl -s -H "Authorization: token $TOKEN" -H "Content-Type: application/json" https://api.github.com/repos/baizenb/tabbit-gateway/releases -d '{"tag_name":"v1.0.0","name":"v1.0.0"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          fi
          code=$(curl -s -o /tmp/up.json -w "%{http_code}" -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @app/build/outputs/apk/debug/app-debug.apk "https://uploads.github.com/repos/baizenb/tabbit-gateway/releases/$RID/assets?name=app-debug.apk")
          echo "asset upload http $code"
          [ "$code" = "201" ] || (echo "::error::asset upload $code $(cat /tmp/up.json)"; exit 1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: tabbit-gateway-apk
          path: app/build/outputs/apk/debug/*.apk
