plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tabbit.gateway'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tabbit.gateway'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
